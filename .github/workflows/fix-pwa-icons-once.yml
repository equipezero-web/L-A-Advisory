name: Normalize Royal PWA icons (one-time repair)
on:
  push:
    branches: [fix/full-audit-20261118]
    paths:
      - .github/workflows/fix-pwa-icons-once.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Resize existing approved logo without changing branding
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          icons = Path('icons')
          for filename, size in [('icons-192.png',192),('icons-512.png',512),('maskable-512.png',512)]:
              path=icons/filename
              with Image.open(path) as img:
                  img=img.convert('RGBA')
                  if filename.startswith('maskable'):
                      # Leave transparent padding outside the safe area.
                      thumb=img.copy()
                      thumb.thumbnail((400,400),Image.Resampling.LANCZOS)
                      canvas=Image.new('RGBA',(512,512),(2,6,23,255))
                      canvas.alpha_composite(thumb,((512-thumb.width)//2,(512-thumb.height)//2))
                  else:
                      canvas=img.resize((size,size),Image.Resampling.LANCZOS)
                  canvas.save(path,'PNG',optimize=True)
                  assert Image.open(path).size==(size,size)
                  print(filename, size)
          PY
      - name: Commit corrected PNG icon dimensions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icons-192.png icons/icons-512.png icons/maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "fix(pwa): correct PNG dimensions to match manifest"
            git push origin HEAD:fix/full-audit-20261118
          fi
