<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Afiliados | Painel ADM Royal Advisory</title>

  <link rel="stylesheet" href="../css/afiliados.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body class="pagina-admin">
  <header class="topo-admin">
    <div class="container navbar">
      <a href="../index.html" class="logo-royal">
        <i class="fa-solid fa-crown"></i>
        <span>Royal Advisory</span>
      </a>

      <span class="identificacao-admin">
        <i class="fa-solid fa-user-shield"></i>
        Painel Administrativo
      </span>
    </div>
  </header>

  <main class="conteudo-admin">
    <div class="container">
      <div class="titulo-admin">
        <div>
          <span class="titulo-secao-mini">GESTÃO ROYAL ADVISORY</span>
          <h1>Programa de Afiliados</h1>
          <p>Analise solicitações, aprove afiliados e acompanhe o programa.</p>
        </div>

        <a href="../afiliado.html" class="botao-secundario">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
          Abrir página pública
        </a>
      </div>

      <nav class="menu-admin">
        <a href="index.html">
          <i class="fa-solid fa-chart-pie"></i>
          Dashboard
        </a>

        <a href="produtos.html">
          <i class="fa-solid fa-box"></i>
          Produtos
        </a>

        <a href="financeiro.html">
          <i class="fa-solid fa-wallet"></i>
          Financeiro
        </a>

        <a href="afiliados.html" class="ativo">
          <i class="fa-solid fa-crown"></i>
          Afiliados
        </a>
      </nav>

      <section class="cards-estatisticas">
        <article class="card-estatistica">
          <div class="icone-estatistica azul">
            <i class="fa-solid fa-hourglass-half"></i>
          </div>
          <div>
            <span>Solicitações pendentes</span>
            <strong id="totalPendentes">0</strong>
          </div>
        </article>

        <article class="card-estatistica">
          <div class="icone-estatistica dourado">
            <i class="fa-solid fa-crown"></i>
          </div>
          <div>
            <span>Afiliados aprovados</span>
            <strong id="totalAprovados">0</strong>
          </div>
        </article>

        <article class="card-estatistica">
          <div class="icone-estatistica vermelho">
            <i class="fa-solid fa-ban"></i>
          </div>
          <div>
            <span>Solicitações recusadas</span>
            <strong id="totalRecusados">0</strong>
          </div>
        </article>
      </section>

      <section class="painel-lista">
        <div class="abas-afiliados">
          <button class="aba-afiliado ativa" data-status="pendente">
            Pendentes
            <span id="contadorPendentes">0</span>
          </button>

          <button class="aba-afiliado" data-status="aprovado">
            Aprovados
            <span id="contadorAprovados">0</span>
          </button>

          <button class="aba-afiliado" data-status="recusado">
            Recusados
            <span id="contadorRecusados">0</span>
          </button>
        </div>

        <div id="listaAfiliados" class="lista-afiliados"></div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="modalConfirmacao" aria-hidden="true">
    <section class="modal-verificacao modal-confirmacao">
      <button
        type="button"
        class="modal-fechar"
        id="fecharModalConfirmacao"
        aria-label="Fechar"
      >
        ×
      </button>

      <div class="modal-icone">
        <i class="fa-solid fa-circle-question"></i>
      </div>

      <h2 id="tituloConfirmacao">Confirmar ação</h2>
      <p id="textoConfirmacao"></p>

      <div class="botoes-confirmacao">
        <button type="button" class="botao-secundario" id="cancelarAcao">
          Cancelar
        </button>

        <button type="button" class="botao-principal" id="confirmarAcao">
          Confirmar
        </button>
      </div>
    </section>
  </div>

  <script src="../js/admin-afiliados.js"></script>
</body>
</html>
