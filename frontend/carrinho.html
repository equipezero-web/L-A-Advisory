<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Carrinho | L&A Royal Advisory</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0c1933">

  <style>
    :root {
      --navy-950: #07101f;
      --navy-900: #0c1933;
      --navy-800: #13264d;
      --gold: #d4af37;
      --gold-light: #f4dc85;
      --silver: #d7dce5;
      --white: #ffffff;
      --surface: #f4f6fa;
      --text: #172033;
      --muted: #667085;
      --border: #dce2eb;
      --danger: #b42318;
      --shadow: 0 14px 36px rgba(7, 16, 31, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background: var(--surface);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1050px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header {
      color: var(--white);
      background: var(--navy-900);
      border-bottom: 2px solid var(--gold);
    }

    .header__content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 74px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    .brand__symbol {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--navy-900);
      background: var(--gold);
      border-radius: 50%;
      font-size: 0.8rem;
    }

    .back-link {
      color: var(--gold-light);
      font-weight: 700;
    }

    main {
      min-height: calc(100vh - 150px);
      padding: 40px 0 56px;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--navy-900);
      font-size: clamp(2rem, 5vw, 2.8rem);
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      align-items: start;
      gap: 24px;
    }

    .cart-list,
    .summary {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .cart-list {
      overflow: hidden;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .cart-item:last-child {
      border-bottom: 0;
    }

    .cart-item__name {
      margin: 0 0 8px;
      color: var(--navy-900);
      font-size: 1.04rem;
    }

    .cart-item__price {
      margin: 0;
      color: var(--muted);
    }

    .cart-item__actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .quantity-control button {
      width: 35px;
      height: 35px;
      color: var(--navy-900);
      background: var(--white);
      border: 0;
      font-weight: 800;
    }

    .quantity-control button:hover {
      background: #eef2f8;
    }

    .quantity-value {
      display: grid;
      width: 38px;
      height: 35px;
      place-items: center;
      border-right: 1px solid var(--border);
      border-left: 1px solid var(--border);
      font-weight: 700;
    }

    .remove-button {
      color: var(--danger);
      background: transparent;
      border: 0;
      font-weight: 700;
    }

    .remove-button:hover {
      text-decoration: underline;
    }

    .cart-item__subtotal {
      color: var(--navy-900);
      font-size: 1.05rem;
      font-weight: 800;
      text-align: right;
    }

    .summary {
      padding: 22px;
    }

    .summary h2 {
      margin: 0 0 20px;
      color: var(--navy-900);
      font-size: 1.25rem;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0;
      color: var(--navy-900);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .button {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 16px;
      color: var(--navy-900);
      background: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 9px;
      font-weight: 800;
    }

    .button:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
    }

    .button-secondary {
      margin-top: 12px;
      color: var(--navy-900);
      background: var(--white);
      border-color: var(--navy-900);
    }

    .button-secondary:hover {
      color: var(--white);
      background: var(--navy-900);
    }

    .empty-state {
      padding: 48px 22px;
      text-align: center;
    }

    .empty-state h2 {
      margin: 0 0 10px;
      color: var(--navy-900);
    }

    .empty-state p {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .footer {
      padding: 24px 0;
      color: var(--silver);
      background: var(--navy-950);
      text-align: center;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .cart-item {
        grid-template-columns: 1fr;
      }

      .cart-item__subtotal {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container header__content">
      <a class="brand" href="./index.html">
        <span class="brand__symbol">L&A</span>
        <span>Royal Advisory</span>
      </a>

      <a class="back-link" href="./loja.html">
        ← Continuar comprando
      </a>
    </div>
  </header>

  <main class="container">
    <h1>Seu carrinho</h1>

    <p class="subtitle">
      Revise os materiais selecionados antes de continuar para o checkout.
    </p>

    <div class="layout">
      <section
        id="cartContainer"
        class="cart-list"
        aria-label="Itens do carrinho"
      >
        <div class="empty-state">
          Carregando carrinho...
        </div>
      </section>

      <aside class="summary" aria-label="Resumo do pedido">
        <h2>Resumo do pedido</h2>

        <div class="summary-line">
          <span>Itens</span>
          <strong id="itemsQuantity">0</strong>
        </div>

        <div class="summary-total">
          <span>Total</span>
          <span id="cartTotal">R$ 0,00</span>
        </div>

        <button
          id="checkoutButton"
          class="button"
          type="button"
        >
          Ir para checkout
        </button>

        <button
          id="clearCartButton"
          class="button button-secondary"
          type="button"
        >
          Limpar carrinho
        </button>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="currentYear"></span> L&A Royal Advisory.
    </div>
  </footer>

  <script src="./carrinho.js" defer></script>
</body>
</html>
