<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Loja Digital | L&A Royal Advisory</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0c1933">

  <style>
    :root {
      --navy-950: #07101f;
      --navy-900: #0c1933;
      --navy-800: #13264d;
      --navy-700: #1d396d;
      --gold: #d4af37;
      --gold-light: #f4dc85;
      --silver: #d7dce5;
      --white: #ffffff;
      --surface: #f4f6fa;
      --text: #172033;
      --muted: #667085;
      --border: #dce2eb;
      --success: #067647;
      --danger: #b42318;
      --shadow: 0 14px 36px rgba(7, 16, 31, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background: var(--surface);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(212, 175, 55, 0.45);
      background: rgba(12, 25, 51, 0.96);
      backdrop-filter: blur(12px);
    }

    .header__content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 74px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--white);
      font-size: 1rem;
      font-weight: 700;
    }

    .brand__symbol {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--navy-900);
      background: linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
      border-radius: 50%;
      font-size: 0.85rem;
      font-weight: 900;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .navigation a {
      color: var(--silver);
      font-size: 0.93rem;
      font-weight: 600;
    }

    .navigation a:hover {
      color: var(--gold-light);
    }

    .cart-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 14px;
      color: var(--navy-900);
      background: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 9px;
      font-weight: 800;
    }

    .cart-button:hover {
      background: var(--gold-light);
    }

    .cart-counter {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      color: var(--white);
      background: var(--navy-900);
      border-radius: 50%;
      font-size: 0.75rem;
    }

    .hero {
      padding: 64px 0 34px;
      color: var(--white);
      background:
        radial-gradient(
          circle at top right,
          rgba(212, 175, 55, 0.26),
          transparent 32%
        ),
        linear-gradient(135deg, var(--navy-950), var(--navy-800));
    }

    .hero h1 {
      max-width: 760px;
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.08;
    }

    .hero p {
      max-width: 680px;
      margin: 0;
      color: var(--silver);
      font-size: 1.04rem;
      line-height: 1.65;
    }

    main {
      padding: 32px 0 56px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      margin-bottom: 28px;
    }

    .search-box,
    .filter-select {
      min-height: 46px;
      padding: 0 14px;
      color: var(--text);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    .search-box:focus,
    .filter-select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }

    .result-message {
      min-height: 24px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 22px;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 42px rgba(7, 16, 31, 0.18);
    }

    .product-image {
      display: grid;
      min-height: 180px;
      place-items: center;
      color: var(--gold-light);
      background:
        radial-gradient(
          circle at top right,
          rgba(212, 175, 55, 0.34),
          transparent 42%
        ),
        linear-gradient(135deg, var(--navy-950), var(--navy-700));
      font-size: 3.2rem;
    }

    .product-image img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .product-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 20px;
    }

    .product-category {
      display: inline-block;
      width: fit-content;
      margin-bottom: 10px;
      padding: 5px 9px;
      color: var(--navy-800);
      background: #eef2f8;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .product-title {
      margin: 0 0 10px;
      color: var(--navy-900);
      font-size: 1.13rem;
      line-height: 1.35;
    }

    .product-description {
      flex: 1;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .product-price {
      color: var(--navy-900);
      font-size: 1.25rem;
      font-weight: 800;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 13px;
      color: var(--navy-900);
      background: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .button:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 46px 20px;
      color: var(--muted);
      background: var(--white);
      border: 1px dashed var(--border);
      border-radius: 14px;
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      width: min(380px, calc(100% - 36px));
      padding: 14px 16px;
      color: var(--white);
      background: var(--navy-900);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .footer {
      padding: 24px 0;
      color: var(--silver);
      background: var(--navy-950);
      text-align: center;
    }

    @media (max-width: 680px) {
      .header__content {
        min-height: auto;
        flex-wrap: wrap;
        padding: 14px 0;
      }

      .navigation {
        order: 3;
        width: 100%;
        justify-content: space-between;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .product-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container header__content">
      <a class="brand" href="./index.html" aria-label="Voltar ao início">
        <span class="brand__symbol">L&A</span>
        <span>Royal Advisory</span>
      </a>

      <nav class="navigation" aria-label="Navegação principal">
        <a href="./index.html">Início</a>
        <a href="./loja.html">Loja</a>
        <a href="./afiliado.html">Afiliados</a>
      </nav>

      <a class="cart-button" href="./carrinho.html" aria-label="Abrir carrinho">
        Carrinho
        <span id="cartCounter" class="cart-counter">0</span>
      </a>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Loja Digital L&A Royal Advisory</h1>
      <p>
        Materiais digitais selecionados para organização financeira,
        gestão empresarial e desenvolvimento estratégico.
      </p>
    </div>
  </section>

  <main class="container">
    <section aria-label="Produtos disponíveis">
      <div class="toolbar">
        <input
          id="searchInput"
          class="search-box"
          type="search"
          placeholder="Pesquisar produto..."
          autocomplete="off"
        >

        <select id="categoryFilter" class="filter-select">
          <option value="all">Todas as categorias</option>
          <option value="ebooks">E-books</option>
          <option value="planilhas">Planilhas</option>
          <option value="guias">Guias</option>
          <option value="templates">Templates</option>
        </select>
      </div>

      <p id="resultMessage" class="result-message" aria-live="polite"></p>

      <div id="productsContainer" class="products-grid">
        <div class="empty-state">
          Carregando produtos...
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="currentYear"></span> L&A Royal Advisory. Todos os direitos reservados.
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./loja.js" defer></script>
</body>
</html>
